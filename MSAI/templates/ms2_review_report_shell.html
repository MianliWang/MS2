<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { --bg:#eef1f5; --paper:#fff; --ink:#172033; --secondary:#5d6678; --muted:#8790a0; --border:#dde2ea; --grid:#e8ebf0; --blue:#246bce; --blue2:#79a9e8; --orange:#d97706; --red:#bd3d45; --green:#25845b; --warning-bg:#fff7e6; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.62 Inter,Segoe UI,Arial,sans-serif; }
    .shell { width:min(1220px,calc(100% - 32px)); margin:24px auto; background:var(--paper); border:1px solid var(--border); border-radius:18px; box-shadow:0 12px 40px rgba(29,43,72,.08); overflow:hidden; }
    .topbar { display:flex; justify-content:space-between; gap:20px; padding:15px 28px; border-bottom:1px solid var(--border); color:var(--secondary); font-size:13px; }
    .brand { font-weight:700; color:var(--ink); }
    .mark { display:inline-block; width:9px; height:9px; margin-right:8px; border-radius:50%; background:var(--blue); }
    main { padding:46px 28px 64px; }
    .reading { max-width:920px; margin:0 auto; }
    .wide { max-width:1120px; margin:28px auto; }
    .kicker { color:var(--blue); font-weight:750; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:8px 0 12px; font-size:42px; line-height:1.15; letter-spacing:-.035em; }
    h2 { margin:38px 0 10px; font-size:25px; line-height:1.3; }
    h3 { margin:0; font-size:18px; }
    .deck { margin:0 0 24px; color:var(--secondary); font-size:18px; }
    .summary { display:grid; grid-template-columns:160px 1fr; gap:24px; padding:22px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .summary-label { font-weight:700; }
    .summary-body p { margin:0 0 10px; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0; }
    .metric,.card,.spectrum-card { border:1px solid var(--border); border-radius:14px; background:#fff; }
    .metric { padding:18px; }
    .metric-label { color:var(--secondary); font-size:13px; }
    .metric-value { margin-top:5px; font-size:28px; font-weight:760; }
    .metric-note { color:var(--muted); font-size:12px; }
    .card { margin:18px 0; overflow:hidden; }
    .card-head { padding:18px 20px 8px; }
    .card-head p,.chart-note { margin:4px 0 0; color:var(--secondary); font-size:13px; }
    .chart-wrap { min-height:320px; padding:8px 18px 12px; overflow-x:auto; }
    [data-recharts-chart] { min-height:320px; }
    [data-recharts-live] { height:320px; }
    .similarity-map-chart, .similarity-map-chart [data-recharts-live] { min-height:400px; height:400px; }
    .chart-fallback svg { display:block; width:100%; min-width:720px; height:auto; }
    .chart-note { padding:0 20px 14px; }
    .source-figure>.source-tooltip { margin:0 20px 18px; }
    .source-tooltip { position:relative; display:inline-flex; align-items:center; border:0; border-bottom:1px dotted var(--muted); background:transparent; color:inherit; font:inherit; cursor:help; }
    .source-tooltip-content { position:absolute; z-index:20; left:0; bottom:calc(100% + 8px); display:none; width:340px; padding:10px 12px; border-radius:9px; background:#172033; color:#fff; font-size:12px; line-height:1.45; text-align:left; box-shadow:0 8px 26px rgba(0,0,0,.22); }
    .source-tooltip:hover .source-tooltip-content,.source-tooltip:focus .source-tooltip-content { display:block; }
    .table-scroll { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:9px 11px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th { background:#f6f8fb; color:var(--secondary); font-weight:700; }
    code { padding:2px 5px; border-radius:5px; background:#f1f4f8; font-size:.9em; }
    .caveat { margin-top:28px; padding:16px 18px; border-left:4px solid var(--orange); border-radius:8px; background:var(--warning-bg); }
    .spectrum-grid { display:grid; gap:14px; }
    .spectrum-card { padding:0; overflow:hidden; }
    .spectrum-card summary { padding:13px 16px; cursor:pointer; font-weight:700; background:#f8fafc; }
    .spectrum-body { padding:12px 16px 16px; }
    .spectrum-meta { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--secondary); font-size:12px; }
    .spectrum-body svg { width:100%; height:auto; min-width:680px; }
    .spectrum-scroll { overflow-x:auto; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#edf3fb; color:#285d9e; font-size:11px; }
    .issue { color:var(--red); }
    ol li,ul li { margin:5px 0; }
    @media (max-width:800px) { .shell{width:100%;margin:0;border:0;border-radius:0}.metrics{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr}.chart-wrap{padding:8px}.source-tooltip-content{left:auto;right:0}.topbar{padding:12px 18px}main{padding:30px 18px}.chart-fallback svg{min-width:680px} }
    @media (max-width:520px) { h1{font-size:32px}.metrics{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="mark"></span>MSAI · MS2 Review</div><div>{{SOURCE_AND_DATE}}</div></header>
    <main data-report-audience="technical">{{REPORT_CONTENT}}</main>
  </div>
  <!-- DATA_ANALYTICS_HTML_REPORT_RUNTIME -->
</body>
</html>
